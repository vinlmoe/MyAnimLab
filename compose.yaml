services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: myvivarium_test
      MYSQL_USER: myvivarium_test
      MYSQL_PASSWORD: local_test_password
      MYSQL_ROOT_PASSWORD: local_root_password
    volumes:
      - test_database:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  composer_vendor:
  test_database:
